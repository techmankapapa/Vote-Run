<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vote Runner</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial;
background-image:url("https://i.ibb.co/YTq9znCh/image-2026-03-13-164413477.png");
background-size:cover;
background-position:center;
}

#scoreboard{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.7);
color:white;
padding:12px 24px;
font-size:22px;
border-radius:10px;
z-index:5;
white-space:nowrap;
}

#overlay{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,0.85);
color:white;
padding:40px;
border-radius:15px;
text-align:center;
z-index:10;
}

img{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(1);
width:340px;
border:5px solid white;
border-radius:12px;
z-index:20;
}

#restartBtn{
display:none;
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
padding:6px 14px;
font-size:14px;
border:none;
border-radius:6px;
background:#4CAF50;
color:white;
box-shadow:0 4px 8px rgba(0,0,0,0.3);
cursor:pointer;
z-index:30;
}

/* bigger on phones */
@media (max-width:768px){
#restartBtn{
padding:12px 24px;
font-size:20px;
}
}

canvas{
display:block;
}

</style>
</head>

<body>

<div id="scoreboard">
Time: <span id="time">30</span>s |
Modi Votes: <span id="modiVotes">0</span> |
Rahul Votes: <span id="rahulVotes">500</span>
</div>

<div id="overlay">
<h1 id="message"></h1>
</div>

<img id="deathImage"
src="https://i.ibb.co/WNXgYRHQ/image-2026-03-11-181741408.png">

<img id="rahulWin"
src="https://imgk.timesnownews.com/DiiW93GVsAAwkBA_1532077929__rend_4_3.jpg?tr=w-360">

<img id="modiWin"
src="https://images.moneycontrol.com/static-mcnews/2024/05/20240518023601_modi-campaign.png">

<button id="restartBtn" onclick="location.reload()">Restart</button>

<audio id="bgm" src="bgm.mp3" loop></audio>
<audio id="dieSound" src="death.mp3"></audio>
<audio id="winSound" src="win.mp3"></audio>
<audio id="loseSound" src="lose.mp3"></audio>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const bgm=document.getElementById("bgm");
const dieSound=document.getElementById("dieSound");
const winSound=document.getElementById("winSound");
const loseSound=document.getElementById("loseSound");

let bgmStarted=false;

function startBGM(){

if(!bgmStarted){

bgm.volume=0.5;
bgm.currentTime=0;
bgm.play().catch(()=>{});

bgmStarted=true;

}

}

document.addEventListener("click",startBGM);
document.addEventListener("keydown",startBGM);
document.addEventListener("touchstart",startBGM,{passive:true});

function stopBGM(){

bgm.pause();
bgm.currentTime=0;

}

const modiImg=new Image();
modiImg.src="https://i.ibb.co/Cs4NsQJ9/image-2026-03-11-184530957-removebg-preview.png";

const rahulImg=new Image();
rahulImg.src="https://i.ibb.co/4w6pn6Ss/images-removebg-preview.png";

let lanes=[window.innerWidth/4,window.innerWidth/2,window.innerWidth*0.75];
let laneIndex=1;

let player={
x:lanes[laneIndex]-45,
y:window.innerHeight-150,
size:100
};

let obstacles=[];
let votes=[];

let modiVotes=0;
let rahulVotes=500;

let speed=8;
let running=true;

let timeLeft=30;

document.addEventListener("keydown",e=>{

if(e.key==="ArrowLeft" && laneIndex>0) laneIndex--;
if(e.key==="ArrowRight" && laneIndex<2) laneIndex++;

player.x=lanes[laneIndex]-45;

});

// ----- TOUCH SUPPORT FOR PHONES -----
function handleTouch(e) {
    // If game is over, let the restart button work normally
    if (!running) return;

    e.preventDefault(); // prevent scrolling while playing
    startBGM();

    let touch = e.touches[0];
    let x = touch.clientX;

    // divide screen into three zones: left, center, right
    if (x < window.innerWidth / 3) {
        laneIndex = 0;
    } else if (x > 2 * window.innerWidth / 3) {
        laneIndex = 2;
    } else {
        laneIndex = 1;
    }
    player.x = lanes[laneIndex] - 45;
}

document.addEventListener("touchstart", handleTouch, { passive: false });
// ------------------------------------

function spawnObstacle(){
obstacles.push({
lane:Math.floor(Math.random()*3),
y:-120
});
}

function spawnVote(){
votes.push({
lane:Math.floor(Math.random()*3),
y:-120
});
}

setInterval(spawnObstacle,800);
setInterval(spawnVote,700);

setInterval(()=>{

if(running){

timeLeft--;
document.getElementById("time").innerText=timeLeft;

if(timeLeft<=0){
endGame();
}

}

},1000);

function update(){

if(!running)return;

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.drawImage(modiImg,player.x,player.y,player.size,player.size);

for(let i=obstacles.length-1;i>=0;i--){

let o=obstacles[i];
o.y+=speed;

let x=lanes[o.lane]-45;

ctx.drawImage(rahulImg,x,o.y,90,90);

if(o.y>canvas.height){
obstacles.splice(i,1);
continue;
}

if(Math.abs(player.x-x)<70 && Math.abs(player.y-o.y)<70){
die();
}

}

for(let i=votes.length-1;i>=0;i--){

let v=votes[i];
v.y+=speed;

let x=lanes[v.lane];

ctx.fillStyle="yellow";
ctx.font="bold 34px Arial";
ctx.fillText("VOTE",x-40,v.y);

if(v.y>canvas.height){
votes.splice(i,1);
continue;
}

if(Math.abs(player.x-x)<70 && Math.abs(player.y-v.y)<70){
modiVotes+=20;
votes.splice(i,1);
}

}

document.getElementById("modiVotes").innerText=modiVotes;

requestAnimationFrame(update);

}

function die(){

running=false;

stopBGM();

dieSound.currentTime=0;
dieSound.play().catch(()=>{});

let img=document.getElementById("deathImage");
img.style.display="block";

zoom(img);
shake();

document.getElementById("overlay").style.display="block";
document.getElementById("message").innerText="YOU DIED";

document.getElementById("restartBtn").style.display="block";

}

function endGame(){

running=false;

stopBGM();

document.getElementById("overlay").style.display="block";

if(modiVotes>=rahulVotes){

document.getElementById("message").innerText="MODI WINS!";

let img=document.getElementById("modiWin");
img.style.display="block";

zoom(img);

winSound.currentTime=0;
winSound.play();

}else{

document.getElementById("message").innerText="RAHUL WINS!";

let img=document.getElementById("rahulWin");
img.style.display="block";

zoom(img);

loseSound.currentTime=0;
loseSound.play();

}

document.getElementById("restartBtn").style.display="block";

}

function zoom(img){

let scale=1;

function animate(){

scale+=0.05;
img.style.transform=`translate(-50%,-50%) scale(${scale})`;

if(scale<4){
requestAnimationFrame(animate);
}

}

animate();

}

function shake(){

let shakes=20;

function s(){

document.body.style.transform=
`translate(${Math.random()*20-10}px,${Math.random()*20-10}px)`;

shakes--;

if(shakes>0){
requestAnimationFrame(s);
}else{
document.body.style.transform="translate(0,0)";
}

}

s();

}

update();

</script>

</body>
</html>
